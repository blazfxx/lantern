name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14          # Apple silicon
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: brew install cmake ninja capstone cpp-httplib nlohmann-json keystone
      - name: Self-tests (engine bridge, renderers, graph layout, edits, patching)
        run: scripts/test.sh
      - name: Build the app
        run: scripts/build-app.sh --zip
      - uses: actions/upload-artifact@v4
        with:
          name: Lantern-macos-arm64
          path: dist/*.zip
